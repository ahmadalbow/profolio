server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # If you use client-side routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets hard (hash-based filenames)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Don't cache index.html (so deployments show quickly)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
